name: php2shell-ubuntu
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppass
      MARIADB_ROOT_PASSWORD: toor
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
  apache:
    build: .
    ports: ["8888:80"]
    volumes: [wp_data:/var/www/html]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  wpinit:
    build: .
    entrypoint: ["/bin/bash", "/install-wp.sh"]
    volumes: [wp_data:/var/www/html]
    depends_on:
      apache: { condition: service_started }
      db: { condition: service_healthy }
    restart: "no"
volumes:
  db_data:
  wp_data:
